[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarseed-runtime"
version = "0.2.0"
description = "Vendor-neutral contracts and gateway for external agent runtimes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["scholarseed_runtime*"]

[tool.setuptools.package-data]
scholarseed_runtime = ["py.typed"]
