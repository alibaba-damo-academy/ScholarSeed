# DeepSeek Harness runtime adapter —— distribution `scholarseed-dsh`。
#
# 保留的接入边界，尚未实现 Provider 或注册 entry point。
# 仅依赖 scholarseed-runtime 公开契约，不依赖书深产品后端或桌面端。

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarseed-dsh"
version = "0.2.0"
description = "ScholarSeed runtime adapter for the DeepSeek Harness runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["scholarseed-runtime==0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scholarseed_dsh*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# PEP 561 标记: 与 codex adapter 对称, 让一方包的类型标注成为公开契约。
scholarseed_dsh = ["py.typed"]
