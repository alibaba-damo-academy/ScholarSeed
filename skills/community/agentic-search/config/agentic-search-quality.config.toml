# Maximum-quality profile for: codex --profile agentic-search-quality
# The verified C1 runs recorded request-level service_tier=priority. Current
# Codex CLI exposes this path as service_tier="fast".
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
service_tier = "fast"
web_search = "live"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
apps = false
fast_mode = true

[sandbox_workspace_write]
network_access = true
