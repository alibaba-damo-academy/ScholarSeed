# ScholarSeed 开源 monorepo 根 —— 只负责编排 (uv workspace)。
#
# 本文件不再是一个可安装的发行包: 产品后端已下沉到 apps/serve (distribution
# `scholarseed`), runtime contracts/Gateway 与 adapter 各自是 packages/ 下的独立发行包。根
# pyproject 只声明 workspace 成员、发行依赖组、共享的开发工具与全仓静态检查配置, 使
# 「一个公开仓库, 多个独立包和发布物」在构建期就成立, 而不是靠约定。

[project]
name = "scholarseed-workspace"
version = "0.2.0"
description = "ScholarSeed open-source monorepo workspace root (orchestration only)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Desktop runtime closure, including the reviewed bundled-skill requirements.
# The registry remains the skill policy; the release contract checks this input.
desktop = [
    "pip>=25",
    "jieba==0.42.1",
    "matplotlib==3.10.8",
    "pysbd==0.3.4",
    "paper-fulltext-dl",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "build>=1",
    "isort>=5",
    "jsonschema>=4",
    "mypy>=1.15,<2",
    "pylint>=3.3,<4",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "types-PyYAML>=6.0.12",
    "types-openpyxl>=3.1",
]  # 格式化、静态检查与测试运行器 (make fmt / make lint / make typecheck / pytest)
# pytest 只存在于 dev extra: DMG 的 Python 依赖由 scripts/dependencies.py 用
# `uv export --extra serve --group desktop --no-default-groups` 导出, 不含 dev extra。

# ── uv workspace: 成员各自持有 pyproject / 依赖 / 测试 / 发布边界 ──
[tool.uv.workspace]
members = [
    "apps/serve",
    "packages/runtime",
    "packages/damoatrace",
    "packages/adapters/codex",
    "packages/adapters/dsh",
]

[tool.uv.sources]
scholarseed-runtime = { workspace = true }
damoatrace = { workspace = true }
scholarseed-codex = { workspace = true }
scholarseed-dsh = { workspace = true }
paper-fulltext-dl = { path = "skills/community/precise-literature-search/vendor/paper_fulltext_dl-0.1.3-py3-none-any.whl" }

[tool.uv]
required-version = ">=0.12.11"
# The root is a virtual orchestration project, never an installed distribution.
package = false

# 索引显式声明: uv 不读 ~/.pip/pip.conf, 不声明则谁跑 `uv lock` 都会把 uv.lock 里
# 的 URL 改写成默认 PyPI, 产生纯噪音的 lock 抖动。
# Desktop 打包从同一 lock 导出带哈希的运行时依赖。
#
# 必须用新式 [[tool.uv.index]], 不能用已弃用的 [tool.uv] index-url: 后者优先级低于
# 任何新式 index 声明, 连 ~/.config/uv/uv.toml 的用户级配置都能把它压过去。uv 把索引
# URL 逐字写进 uv.lock 的 source.registry, 同一个镜像只差一个尾斜杠就被判成两个索引,
# 于是 `uv sync --locked` 报 lock 过期、`uv lock` 产出上百行纯噪音 diff。
# URL 写法必须与 uv.lock 里的 source.registry 一致(不带尾斜杠)。
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# editable_mode=compat 按包声明, 而不是在命令行上传 —— 静态分析 (pyright pin 了
# .venv) 与 importlib.metadata 依赖它把源码树直接摊到 .pth 上; 写成命令行 flag 时,
# 任何一步顺带重装这些包 (例如解析 scholarseed 的依赖) 都会把 compat 形态冲掉。
[tool.uv.config-settings-package]
scholarseed-runtime = { editable_mode = "compat" }
damoatrace = { editable_mode = "compat" }
scholarseed-codex = { editable_mode = "compat" }
scholarseed-dsh = { editable_mode = "compat" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
# 类型检查基线 (Pylance / pyright 共用此配置)。pin 解释器到项目 venv → 第三方包/本仓库
# import 都能正确解析 (否则不同机器的 Pylance 解释器不一致会报 import / 类型幻影)。
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps/serve/service", "packages/runtime/scholarseed_runtime", "packages/adapters", "scripts"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/dist",
    "**/build",
    "tmp",
    "apps/desktop",
    "packages/damoatrace",
]
# Tool 子类 execute(inputs: <具体 Pydantic 模型>) 对基类 execute(inputs: BaseModel) 做参数收窄,
# 是工具系统的**有意设计** (每个工具声明自己的输入模型); LSP 逆变告警在此模式下是噪音, 关掉。
reportIncompatibleMethodOverride = false

[tool.mypy]
# Runtime 与产品消费者一起检查，独立发行不等于跳过公共 ABI 的类型检查。
files = ["apps/serve/service", "packages/runtime/scholarseed_runtime", "packages/damoatrace/damoatrace", "packages/adapters", "scripts"]
python_version = "3.12"
explicit_package_bases = true
# 每个受检包的**包根**都要列出, 否则 mypy 拿仓库根当基准, 同一份 adapter 源码会既是
# `packages.adapters.codex.scholarseed_codex.appserver` 又是 `scholarseed_codex.appserver`
# (两个 adapter 带 py.typed 后可从已安装包解析), 报 "found twice under different
# module names" 并中断整个检查。
mypy_path = ["apps/serve", "packages/runtime", "packages/damoatrace", "packages/adapters/codex", "packages/adapters/dsh"]
plugins = ["pydantic.mypy"]
exclude = '''(?x)(
    ^apps/desktop/
  | ^packages/damoatrace/damoatrace/tests/
  | ^skills/
  # 技能 pack 是 `prebundle --build` 的生成物 (源码事实源在 skills/community/)。
  # 它的契约由 prebundle 的逐字节复核保障, 不参与产品层类型门; 且包内有同名
  # 模块 (多个 module 各带一个 adapter.py), mypy 会报 Duplicate module 并中断整个
  # 检查。black/isort 早已排除它, 这里补齐。
  | ^apps/serve/service/capabilities/skills/
  | (^|/)node_modules/
  | (^|/)__pycache__/
  | (^|/)\.venv/
  | ^tmp/
  | (^|/)(dist|build)/
)'''

[tool.pylint.main]
py-version = "3.12"
ignore-paths = [
    "^apps/desktop/.*$",
    "^packages/damoatrace/.*$",
    # 技能源码是随仓开源的一方技能资产 (skills/community/), 由 prebundle 契约与技能自身的
    # 门禁校验; 编译产出 apps/serve/service/capabilities/skills/ 是生成物, 不手工维护。
    "^skills/.*$",
    "^apps/serve/service/capabilities/skills/.*$",
    "(^|/)node_modules/.*$",
    "(^|/)__pycache__/.*$",
    "(^|/)\\.venv/.*$",
    "^tmp/.*$",
    "(^|/)(dist|build)/.*$",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.imports]
# Pylint only exposes an explicit third-party classification. Treat workspace
# distributions as installed dependencies for its ordering check so ignored legacy
# checkout directories cannot make the result depend on local filesystem residue.
known-third-party = [
    "scholarseed_runtime",
    "damoatrace",
    "service",
    "scholarseed_codex",
    "scholarseed_dsh",
]

[tool.pylint.messages_control]
# 这些是项目已有的文档与复杂度约定，不是可靠的缺陷信号：格式由 black/isort
# 负责，公开文档由 Markdown/skill 资产承载。其余的运行时边界类告警也在这里统一处理：
# agent 的 provider、sandbox、plugin 和 callback 边界必须保留原始异常/兼容签名，不能为了
# 迎合静态启发式改变恢复语义。E/F 级错误、导入位置、未解析依赖和真实成员访问仍保持启用。
disable = [
    "attribute-defined-outside-init",
    "broad-exception-caught",
    "chained-comparison",
    "consider-using-in",
    "consider-using-with",
    "cyclic-import",
    "disallowed-name",
    "duplicate-code",
    "f-string-without-interpolation",
    "global-statement",
    "invalid-name",
    "invalid-overridden-method",
    "line-too-long",
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-return",
    "protected-access",
    "raise-missing-from",
    "redefined-builtin",
    "redefined-outer-name",
    "simplifiable-condition",
    "subprocess-run-check",
    "superfluous-parens",
    "too-many-nested-blocks",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "try-except-raise",
    "unnecessary-comprehension",
    # Protocol / stub 声明惯例: platform 层 Port 的方法体是 docstring + `...`。
    # pylint 认为有 docstring 后 `...` 多余, 但去掉它会让「这是声明、不是实现」这层
    # 意图消失 (typeshed 同样保留)。全仓 Port 方法一致采用此写法。
    "unnecessary-ellipsis",
    "unspecified-encoding",
    "unused-argument",
    "unused-variable",
    "use-dict-literal",
]


# ── 代码格式化: black + isort (统一风格; line-length 对齐既有代码密度) ──
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  | apps/desktop/node_modules
  | skills
  | apps/serve/service/capabilities/skills
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "scholarseed_runtime",
    "damoatrace",
    "scholarseed_codex",
    "scholarseed_dsh",
    "service",
]
skip_glob = [
    "skills/*",
    "apps/serve/service/capabilities/skills/*",
    "apps/desktop/node_modules/*",
    ".venv/*",
]
