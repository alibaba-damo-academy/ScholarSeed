name: Research plugin
description: Propose or introduce a research plugin
title: "[Plugin]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to discuss a plugin idea or introduce an existing implementation.

        Read the [contribution guide](https://github.com/alibaba-damo-academy/ScholarSeed/blob/main/CONTRIBUTING.md) and [plugin documentation](https://github.com/alibaba-damo-academy/ScholarSeed/blob/main/doc/plugins.md).

        An issue does not submit code, install a plugin, or publish it to a marketplace. Do not attach credentials or private research data.
  - type: dropdown
    id: stage
    attributes:
      label: Proposal stage
      options:
        - Idea
        - In development
        - Implementation available
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Research scenario and intended users
      description: Explain the research problem and who would use this plugin.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Inputs, workflow, and expected outputs
      description: Give a small, shareable example and describe what successful use looks like.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and requirements
      description: If known, list ScholarSeed versions, OS/architecture, dependencies, model/service requirements, and configuration without secrets.
  - type: textarea
    id: implementation
    attributes:
      label: Existing implementation
      description: Optional for ideas. Include the plugin ID/version, author, source revision/link, license, versioned ZIP if available, and maintenance location.
  - type: textarea
    id: validation
    attributes:
      label: Actual validation and known limits
      description: If implemented, describe package checks and real-task results, including missing-input/failure cases, tested platforms, and unverified items.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and plugins for similar work.
          required: true
        - label: I have permission to share all included materials and removed credentials, private data, and personal information.
          required: true
