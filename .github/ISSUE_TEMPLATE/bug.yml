name: Bug report
description: Report a reproducible ScholarSeed problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem per report.

        This is a public issue. Do not post security exploit details, credentials, login links, private research data, or unredacted logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or startup
        - Conversation or model connection
        - Literature, reading, or citations
        - Plugin or Skill
        - Interface or language
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal, shareable prompt or input when relevant.
      placeholder: |
        1. Open ...
        2. Enter or click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScholarSeed version
      description: Copy the full version from About; source users may provide the commit SHA. Enter Unknown if unavailable.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system and architecture
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How do you run ScholarSeed?
      options:
        - Official installer
        - Source checkout
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant configuration
      description: Fill only what applies; never include secrets.
      placeholder: |
        OS version and UI language:
        Model provider and model name:
        ScholarSeed account, own API key, or third-party authorization:
        Plugin ID/version and failure stage (install, enable, or execute):
        Source users: commit, command, Node/pnpm/uv versions:
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error, logs, or screenshots
      description: Optional. Share only relevant excerpts; do not upload your entire user-data directory.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, private data, and personal information from this report and its attachments.
          required: true
