name: Feature request
description: Suggest a research-workbench improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A technical implementation is not required.

        For a reproducible malfunction, use Bug report. For a research plugin proposal, use Research plugin.
  - type: textarea
    id: scenario
    attributes:
      label: Research scenario and current difficulty
      description: What are you trying to accomplish, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired improvement
      description: Describe the user-visible result, not necessarily an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. Explain how you handle this today.
  - type: textarea
    id: references
    attributes:
      label: Examples and references
      description: Optional. Add shareable examples, screenshots, links, or expected usage frequency.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar suggestion.
          required: true
        - label: This report and its attachments contain no credentials, private research data, or personal information.
          required: true
