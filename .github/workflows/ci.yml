name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Public source build and distribution contracts
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.13.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application and prepare Python
        run: npm run ops -- --package-manager npm cd build local --stage app

      - name: Run distribution contracts
        run: node --test scripts/shared/__tests__/artifacts.test.cjs apps/desktop/scripts/cd/__tests__/build.test.cjs
