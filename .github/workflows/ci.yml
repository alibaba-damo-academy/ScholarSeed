name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow syntax and package artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check workflow syntax
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Check package artifacts
        run: node --test .github/scripts/*.test.cjs

  test:
    name: Public source build and distribution contracts
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.13.0

      - name: Setup uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application and prepare Python
        env:
          # The renderer exceeds V8's default ~2 GiB heap on the 7 GiB macOS runner.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run ops -- --package-manager npm cd build local --stage app

      - name: Run distribution contracts
        env:
          # Avoid macOS /var -> /private/var aliases in no-symlink build fixtures.
          TMPDIR: ${{ runner.temp }}
        run: node --test scripts/shared/__tests__/permissions.test.cjs scripts/shared/__tests__/lease.test.cjs scripts/shared/__tests__/artifacts.test.cjs apps/desktop/scripts/cd/__tests__/build.test.cjs apps/desktop/scripts/cd/__tests__/osx-sign.test.cjs
