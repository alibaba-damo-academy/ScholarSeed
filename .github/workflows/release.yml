name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Package Sigend run ID to publish
        type: string
        required: true
      tag:
        description: 'New tag matching the package version (e.g. v0.3.1-preview.1 or v0.3.1)'
        type: string
        required: true
      channel:
        description: Must match the selected build's package update channel
        type: choice
        options: [preview, release]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish an existing signed build
    if: github.repository == 'alibaba-damo-academy/ScholarSeed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: node .github/scripts/release-source.cjs

      - name: Download signed installers and checksums
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: '*.dmg*'
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Download build evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: build-report-*
          path: ${{ runner.temp }}/release-reports

      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PACKAGE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: node .github/scripts/release.cjs "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/release-reports"
