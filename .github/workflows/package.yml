name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Native installer (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            runner: macos-14
          - name: Windows EXE
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.13.0

      - name: Setup uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify native lease permissions
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test scripts/shared/__tests__/permissions.test.cjs scripts/shared/__tests__/lease.test.cjs

      - name: Build macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Keep the renderer above its ~2 GiB default heap, with room for native tools.
          NODE_OPTIONS: --max-old-space-size=4096
          # osx-sign scans the bundled TeX tree concurrently before applying ignore rules.
          MACOS_BUILD_OPEN_FILES: "65536"
        run: |
          current=$(ulimit -Sn)
          if [[ "$current" != unlimited && "$current" -lt "$MACOS_BUILD_OPEN_FILES" ]]; then
            ulimit -Sn "$MACOS_BUILD_OPEN_FILES"
          fi
          echo "macOS build open-file limit: $(ulimit -Sn)"
          npm run ops -- --package-manager npm cd build local --stage installer

      - name: Build Windows package
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run ops -- --package-manager npm cd build local --stage installer

      - name: Upload package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scholarseed-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/**/artifacts/*.dmg
            apps/desktop/release/**/artifacts/velopack/*Setup.exe
            apps/desktop/release/**/result.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
