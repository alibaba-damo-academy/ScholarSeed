  # content-type: 每篇 research 文档带且仅带一个, 是知识库的主分类轴
  # 与 domain/system 正交；旧研究索引生成器已退役，不据此新增研究目录或重建索引。
  content-type:
    - paper-survey         # 按会议/顶会拆分的论文综述 (收录证据 + 逐篇精读)
    - topic-survey         # 按主题拆分的文章调研综述 (跨系统/跨论文归纳)
    - system-deepdive      # 开源项目 / 具名系统 / 数据集的单点深拆
    - harness-decompile    # Claude Code / Codex 等外部 harness 的一手反编译研究
    - usecase              # 用户场景 / 端到端剧本压测

