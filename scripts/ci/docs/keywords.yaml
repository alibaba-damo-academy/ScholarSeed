    - responses-api        # OpenAI Responses 协议 (别名 responses)
    - model-catalog        # 可选模型枚举 / 目录
    - compaction
    - evaluation
    - product
    - architecture
    - monorepo             # 多包单仓布局 (apps/ + packages/ + uv workspace)
    - packaging            # 发行包 / wheel / DMG 边界与构建产物
    - persistence          # 落盘布局: SCHOLARSEED_HOME / sqlite / 会话目录
    - toolchain            # npm scripts / 格式化 / lint / 类型检查入口
    - test-gate            # 契约门禁与验收分层
    - business-domain      # MVP 0.2 六域纵向切分 (content/resources/literature/workbench/documents/assistant)
    - workbench            # 共享工作台: 多标签 / Viewer 注册 / 打开协议
    - literature           # 文献库域: 导入 / 元数据 / 检索 / 集合
    - document-editing     # Markdown/DOCX 编辑、版本、ChangeSet、Diff
    - code-ownership       # 目录所有权 / 热点文件 / 并行分工边界
    - design-system        # components/ui 原子库 / 意图索引 / 原生标签禁令与复用门禁
