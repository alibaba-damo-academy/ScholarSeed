# 当前知识检查的受控关键词词表 (单一来源)
# ─────────────────────────────────────────────────────────────────────────────
# 每篇文档 frontmatter 的 `keywords:` 必须全部命中本表 (经 aliases 归一后)。
# scripts/ci/docs/check.py 通过 scripts/ci/docs/vocabulary.py 读取并校验本表。
#
# 分面 (facet) 用于组织关键词，不授权重建已退役的 Wiki 静态站:
#   domain            机制 / 领域 (memory / context / runtime / ...)
#   system            具名系统 / 产品 / 数据集 (mem0 / vikingmem / locomo / ...)
#   method            技术手法 (consolidation / compaction / hypothesis-tree / ...)
#   external-baseline 对标的外部 agent / 工具 (claude-code / codex / ...)
#   usecase           用户场景 (phd-research / code-agent / ...)
#
# 加新词: 放进对应 facet; 加同义词: 放进 aliases (alias -> canonical)。

facets:
  domain:
    - memory
    - context
    - prompt
    - harness
    - runtime
    - sdk
    - model
    - agent-core
