# ScholarSeed 产品后端 (FastAPI Serve + composition root) —— distribution `scholarseed`。
#
# 边界: 本包只拥有 apps/serve/service/**。runtime kernel (damoagent)、证据查询
# (damoatrace) 与 runtime adapter (scholarseed-codex) 都是独立发行包,
# 这里只作依赖声明, 绝不打包它们的 namespace。

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarseed"
version = "0.2.0"
description = "ScholarSeed product backend, composition root, and desktop launcher"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "damoatrace==0.1.0",
    "anthropic",
    "beautifulsoup4>=4.12",
    "fastcdc>=1.7,<2",
    "httpx",            # tool backend (LocalBackend) 顶层硬依赖
    "json-repair",
    "lxml>=5.2",
    "numpy",
    "openpyxl",
    "openai",
    "packaging>=24.2",  # build-time skill version ordering
    "pathspec>=0.12,<2", # resource version ignore rules, including nested .gitignore
    "patchright>=1.44",
    "pillow",
    "playwright>=1.44",
    "pypdf>=6.15.0,<7",
    "pydantic",
    "python-docx",
    "python-pptx",
    "pyyaml",           # skills frontmatter / memory packs / context config
    "rich",
    "scholarseed-runtime==0.2.0",
    "tenacity>=9.0",
    "truststore>=0.10", # 出站 TLS 走 OS 信任库: certifi 内置根永远不含企业中间人代理根
    "typer>=0.12",
    "xlrd>=2.0.1,<3",
    "zstandard>=0.23,<1",
    "pdfplumber>=0.11.10,<0.12",
    "pypdfium2>=5,<5.12",     # PDF 渲染与快速文本；5.12+ 无 macOS <13 x86_64 wheel
    "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
# Explicit optional integrations; not part of the default Desktop backend.
docker = ["docker"]                     # DockerBackend
claude-sdk = ["claude-agent-sdk"]
# runtime adapter: 产品默认随 codex adapter 一起交付。
codex = ["scholarseed-codex"]
serve = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-pptx",
    "PyJWT",
    "cryptography<49.0.0",
    "watchfiles>=0.24",
]  # `scholarseed serve` 单机 Agent Serve (multipart=资源上传;
   # PyJWT+cryptography=托管账号令牌的 RS256 离线验签;
   # watchfiles=资料库/文献库的文件变化监听, Rust notify 后端 + 原生 async。
   # 装不上时监听降级为定时轮询 + RESCAN, 产品仍可用, 只是刷新变慢)
all = [
    "docker",
    "claude-agent-sdk",
    "scholarseed-codex",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-pptx",
    "PyJWT",
    "cryptography<49.0.0",
    "watchfiles>=0.24",
]

[project.scripts]
# 产品入口归 Serve；DamoAgent 不提供产品 CLI。
scholarseed = "service.cli.desktop:main"
scholarseed-serve = "service.cli.serve:serve_main"
scholarseed-desktop = "service.cli.desktop:main"
scholarseed-bridge = "service.cli.bridge:main"
scholarseed-skill-python = "service.cli.skill_python:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"service.settings" = ["default.json", "capabilities.*.json"]
# 产品 wheel 只拥有产品运行期数据; SDK 与 trace 资产属于各自独立的
# damoagent / damoatrace 发行包。capabilities/skills/ 是 prebundle 从仓库内
# skills/community/ 离线编译出的技能 pack, 随 wheel 交付。
service = [
    "**/*.md",
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/.scholarseed.json",
    "**/*.toml",
    "**/*.txt",
    "**/*.sql",
    "capabilities/skills/**/*.py",
    "capabilities/skills/**/*.js",
    "capabilities/skills/**/*.mjs",
    "capabilities/skills/**/*.svg",
    "capabilities/skills/**/*.png",
    "capabilities/skills/**/*.ipynb",
    "capabilities/skills/**/*.sh",
    "capabilities/skills/**/*.env",
    "capabilities/skills/**/*.whl",
]
